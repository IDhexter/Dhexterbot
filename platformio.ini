; PlatformIO Project Configuration — DhexterBot OS
; Repository: https://github.com/IDhexter/Dhexterbot
; Hardware:   GeekMagic SmallTV (ESP-12F / ESP8266, 4MB Flash, ST7789 240x240 IPS)

[platformio]
default_envs = smalltv

[common]
build_src_flags =
	-iquote src
	-iquote src/features/notify
	-iquote src/features/pet

lib_deps =
	bblanchon/ArduinoJson @ ^7.4.0
	moononournation/GFX Library for Arduino @ ^1.5.0

[env:smalltv]
platform = espressif8266
board = esp12e
framework = arduino

board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
extra_scripts = pre:extra_script.py

monitor_speed = 115200
upload_speed = 921600

build_flags =
	-D SMALLTV_ESP8266
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D ARDUINOJSON_USE_DOUBLE=0
	-D WITH_PET=1
	-D WITH_NOTIFY=1
	-D WITH_TICKER=0
	-D WITH_USAGE=0
	-D WITH_RADAR=0
	-D WITH_HA=0
	-D WITH_THEME=0

build_src_flags = ${common.build_src_flags}
lib_deps = ${common.lib_deps}
